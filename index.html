<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 54 54' fill='none'><rect x='8' y='12' width='32' height='32' rx='7' stroke='%2310B981' stroke-width='4'/><circle cx='44' cy='10' r='3.5' fill='%2310B981'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CopperOS — Sistema Operacional Corporativo</title>
    
    <!-- CRITICAL: Apply theme BEFORE React renders to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('copperos_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
